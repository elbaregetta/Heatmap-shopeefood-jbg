<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Radar Jombang</title>
<style>
body{margin:0;background:#1e2229;color:#fff;font-family:sans-serif;overflow:hidden}
#top{background:#ee4d2d;padding:10px;text-align:center;font-weight:bold;font-size:15px}
#bar{background:#2b303a;padding:8px;display:flex;gap:6px}
select,button{padding:8px;border-radius:6px;border:none;font-weight:bold;font-size:12px}
select{flex:1;background:#fff;color:#222}
#b1{background:#007bff;color:#fff}#b2{background:#28a745;color:#fff}
#info{position:fixed;bottom:15px;left:15px;right:15px;background:#fff;color:#222;padding:12px;border-radius:8px;display:none;font-size:13px;box-shadow:0 4px 12px #000}
</style>
</head>
<body>
<div id="top">🛵 Radar Heatmap & Resto Jombang</div>
<div id="bar">
<select id="jam" onchange="draw()">
<option value="0">Semua Jam Ramai</option>
<option value="1">Pagi (06-11)</option>
<option value="2">Siang (11-15)</option>
<option value="3">Sore (15-19)</option>
<option value="4">Malam (19-24)</option>
</select>
<button id="b1" onclick="pin=!pin;draw()">👁️ Pin</button>
<button id="b2" onclick="gps()">📍 Saya</button>
</div>
<canvas id="cv"></canvas>
<div id="info" onclick="this.style.display='none'"></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),info=document.getElementById('info');
let cLat=-7.5485,cLng=112.2331,zm=11500,pin=true,me=null;

const jln=[
{n:"Gatot Subroto",a:-7.532,b:112.232,c:-7.545,d:112.2332},
{n:"Wahid Hasyim",a:-7.545,b:112.2332,c:-7.5545,d:112.2332},
{n:"Jl. Gus Dur",a:-7.5545,b:112.2332,c:-7.568,d:112.2335},
{n:"Raya Diwek",a:-7.568,b:112.2335,c:-7.605,d:112.2375},
{n:"Adityawarman",a:-7.5475,b:112.218,c:-7.5455,d:112.2332},
{n:"Urip Sumoharjo",a:-7.5488,b:112.2332,c:-7.548,d:112.25},
{n:"Peterongan",a:-7.548,b:112.25,c:-7.544,d:112.28},
{n:"Mojoagung",a:-7.544,b:112.28,c:-7.574,d:112.348},
{n:"KH. A. Dahlan",a:-7.5535,b:112.227,c:-7.5535,d:112.2332},
{n:"Gubernur Suryo",a:-7.5542,b:112.2332,c:-7.5542,d:112.24}
];

const resto=[
{n:"PHD Wahid Hasyim",al:"Jl. KH. Wahid Hasyim",lt:-7.5515,lg:112.2328,j:19},
{n:"Mixue Wahid Hasyim",al:"Jl. KH. Wahid Hasyim",lt:-7.5502,lg:112.2330,j:14},
{n:"Mie Gacoan Jombang",al:"Jl. Urip Sumoharjo",lt:-7.5488,lg:112.2356,j:13},
{n:"Sentra Kuliner",al:"Jl. Gubernur Suryo",lt:-7.5542,lg:112.2335,j:18},
{n:"Belikopi Jombang",al:"Jl. KH. A. Dahlan",lt:-7.5535,lg:112.2312,j:16},
{n:"Sentra PKL Dahlan",al:"Jl. KH. A. Dahlan",lt:-7.5538,lg:112.2305,j:20},
{n:"Rasaloka Jombang",al:"Jl. Adityawarman",lt:-7.5451,lg:112.2289,j:14},
{n:"Warkop Mr. Bento",al:"Pos Driver Adityawarman",lt:-7.5458,lg:112.2295,j:15},
{n:"Kokiku Jombang",al:"Jl. Pahlawan",lt:-7.5471,lg:112.2255,j:13},
{n:"Sedap Malam Cak Lan",al:"Jl. Dewi Sartika (24 Jam)",lt:-7.5565,lg:112.2265,j:22},
{n:"Geprek Gober",al:"Sambong Permai",lt:-7.5398,lg:112.2375,j:12},
{n:"RM Henny",al:"Jl. Gatot Subroto",lt:-7.5385,lg:112.2321,j:12},
{n:"Dapur DK",al:"Jl. Dr. Sutomo",lt:-7.5529,lg:112.2368,j:17},
{n:"Nasgor Pasar Legi",al:"Jl. KH. Mimbar",lt:-7.5432,lg:112.2315,j:21},
{n:"Sarapan Alun-Alun",al:"Jl. Diponegoro",lt:-7.5462,lg:112.2335,j:8},
{n:"Kuliner UNDAR",al:"Jl. Gus Dur",lt:-7.5582,lg:112.2325,j:12},
{n:"Kuliner UNIPDU",al:"Peterongan",lt:-7.5435,lg:112.2745,j:12},
{n:"Kuliner Cukir/Diwek",al:"Jl. Irian Jaya",lt:-7.6035,lg:112.2372,j:13},
{n:"Rawon Rosobo",al:"Jl. Raya Mojoagung",lt:-7.5732,lg:112.3456,j:9}
];

function xy(lt,lg){return{x:(cv.width/2)+(lg-cLng)*zm,y:(cv.height/2)-(lt-cLat)*zm}}

function draw(){
cv.width=window.innerWidth;
cv.height=window.innerHeight-90;
ctx.fillStyle="#1e2229";ctx.fillRect(0,0,cv.width,cv.height);

ctx.strokeStyle="#282c34";ctx.lineWidth=1;
for(let x=0;x<cv.width;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,cv.height);ctx.stroke()}
for(let y=0;y<cv.height;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cv.width,y);ctx.stroke()}

ctx.strokeStyle="#4b5263";ctx.lineWidth=6;ctx.lineCap="round";
jln.forEach(s=>{
let p1=xy(s.a,s.b),p2=xy(s.c,s.d);
ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();
ctx.fillStyle="#9da5b4";ctx.font="10px sans-serif";ctx.fillText(s.n,(p1.x+p2.x)/2+4,(p1.y+p2.y)/2-4);
});

let f=document.getElementById('jam').value;
let akt=resto.filter(r=>f=="0"||(f=="1"&&r.j>=6&&r.j<11)||(f=="2"&&r.j>=11&&r.j<15)||(f=="3"&&r.j>=15&&r.j<19)||(f=="4"&&(r.j>=19||r.j<6)));

ctx.globalCompositeOperation="lighter";
akt.forEach(r=>{
let p=xy(r.lt,r.lg),g=ctx.createRadialGradient(p.x,p.y,4,p.x,p.y,55);
g.addColorStop(0,"rgba(255,30,0,0.85)");g.addColorStop(0.5,"rgba(255,140,0,0.35)");g.addColorStop(1,"rgba(0,0,0,0)");
ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,55,0,6.28);ctx.fill();
});
ctx.globalCompositeOperation="source-over";

if(pin){
akt.forEach(r=>{
let p=xy(r.lt,r.lg);
ctx.fillStyle="#ff5722";ctx.beginPath();ctx.arc(p.x,p.y,6,0,6.28);ctx.fill();
ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke();
});
}

let al=xy(-7.5462,112.2332);
ctx.fillStyle="#61dafb";ctx.font="bold 11px sans-serif";ctx.fillText("★ ALUN-ALUN JOMBANG",al.x-55,al.y-10);

if(me){
let p=xy(me.lt,me.lg);
ctx.fillStyle="#00e676";ctx.beginPath();ctx.arc(p.x,p.y,8,0,6.28);ctx.fill();
ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke();
ctx.fillText("POSISI ANDA",p.x+10,p.y+4);
}
}

let dr=false,lx=0,ly=0;
cv.addEventListener('touchstart',e=>{
dr=true;let t=e.touches.item(0);lx=t.clientX;ly=t.clientY;
let hit=false;
resto.forEach(r=>{
let p=xy(r.lt,r.lg);
if(Math.hypot(p.x-lx,p.y-(ly-90))<22){
info.innerHTML="<b style='color:#ee4d2d'>🍴 "+r.n+"</b><br>"+r.al+"<br><small>Jam Ramai: "+r.j+":00</small>";
info.style.display="block";hit=true;
}
});
if(!hit)info.style.display="none";
});
cv.addEventListener('touchmove',e=>{
if(!dr)return;e.preventDefault();
let t=e.touches.item(0);cLng-=(t.clientX-lx)/zm;cLat+=(t.clientY-ly)/zm;lx=t.clientX;ly=t.clientY;draw();
},{passive:false});
cv.addEventListener('touchend',()=>dr=false);

function gps(){
navigator.geolocation.getCurrentPosition(p=>{
me={lt:p.coords.latitude,lg:p.coords.longitude};cLat=me.lt;cLng=me.lg;draw();
},()=>alert("Aktifkan GPS HP Anda."));
}
draw();
</script>
</body>
</html>
