<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Heatmap & Resto Jombang</title>
    <link rel="stylesheet" href="https://cloudflare.com" />
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f0f0f0; }
        #header { background: #ee4d2d; color: white; padding: 12px; text-align: center; font-weight: bold; font-size: 16px; }
        #controls { background: #ffffff; padding: 8px; display: flex; gap: 6px; border-bottom: 1px solid #ddd; }
        select, button { padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 13px; }
        #filter-waktu { flex: 1; font-weight: bold; color: #333; background: #fff; }
        #btn-toggle-resto { background: #007bff; color: white; border: none; font-weight: bold; }
        #btn-lokasi { background: #28a745; color: white; border: none; font-weight: bold; }
        #map { width: 100%; height: calc(100vh - 135px); background: #ddd; }
        #footer { background: #fff; padding: 8px; text-align: center; font-size: 12px; color: #333; border-top: 1px solid #ddd; }
    </style>
</head>
<body>

    <div id="header">🛵 Peta Area Ramai & Resto Jombang</div>
    
    <div id="controls">
        <select id="filter-waktu" onchange="renderHeatmap()">
            <option value="semua">Semua Jam Ramai</option>
            <option value="pagi">Pagi (06:00 - 11:00)</option>
            <option value="siang">Siang (11:00 - 15:00)</option>
            <option value="sore">Sore (15:00 - 19:00)</option>
            <option value="malam">Malam (19:00 - 24:00)</option>
        </select>
        <button id="btn-toggle-resto" onclick="toggleResto()">👁️ Pin</button>
        <button id="btn-lokasi" onclick="cariLokasiSaya()">📍 Saya</button>
    </div>

    <div id="map"></div>
    <div id="footer">Status: <b id="status-peta">Memuat peta...</b></div>

    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>

    <script>
        window.onload = function() {
            const statusEl = document.getElementById('status-peta');

            if (typeof L === 'undefined') {
                statusEl.innerHTML = "<span style='color:red'>Gagal memuat sistem peta. Cek koneksi internet.</span>";
                return;
            }

            // 1. Inisialisasi Peta Pusat Kota Jombang
            const map = L.map('map').setView([-7.5485, 112.2331], 14);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);

            let heatLayer = null;
            let restoLayerGroup = L.layerGroup().addTo(map);
            let markerSaya = null;
            let tampilkanResto = true;

            // 2. Database Titik Kuliner Jombang
            const daftarResto = [
                { nama: "Pizza Hut Delivery (PHD)", alamat: "Jl. KH. Wahid Hasyim", lat: -7.5515, lng: 112.2328, jam: 19, bobot: 1.0 },
                { nama: "Mixue & Kuliner Wahid Hasyim", alamat: "Jl. KH. Wahid Hasyim", lat: -7.5502, lng: 112.2330, jam: 14, bobot: 1.0 },
                { nama: "Mie Gacoan Jombang", alamat: "Jl. Urip Sumoharjo No.21", lat: -7.5488, lng: 112.2356, jam: 13, bobot: 1.0 },
                { nama: "Sentra Kuliner Jombang", alamat: "Jl. Gubernur Suryo No.15", lat: -7.5542, lng: 112.2335, jam: 18, bobot: 1.0 },
                { nama: "Belikopi Jombang", alamat: "Jl. KH. A. Dahlan No.14", lat: -7.5535, lng: 112.2312, jam: 16, bobot: 0.9 },
                { nama: "Sentra PKL KH. A. Dahlan", alamat: "Jl. KH. A. Dahlan", lat: -7.5538, lng: 112.2305, jam: 20, bobot: 1.0 },
                { nama: "Rasaloka Jombang", alamat: "Jl. Adityawarman No.45a", lat: -7.5451, lng: 112.2289, jam: 14, bobot: 0.9 },
                { nama: "Warkop Mr. Bento (Pos Driver)", alamat: "Jl. Adityawarman No.27", lat: -7.5458, lng: 112.2295, jam: 15, bobot: 0.9 },
                { nama: "Kokiku Jombang", alamat: "Jl. Pahlawan No.59", lat: -7.5471, lng: 112.2255, jam: 13, bobot: 0.8 },
                { nama: "Sedap Malam Cak Lan (24 Jam)", alamat: "Jl. Dewi Sartika No.12", lat: -7.5565, lng: 112.2265, jam: 22, bobot: 0.9 },
                { nama: "Ayam Geprek Gober", alamat: "Sambong Permai Blok C6", lat: -7.5398, lng: 112.2375, jam: 12, bobot: 0.9 },
                { nama: "RM & Catering Henny", alamat: "Jl. Gatot Subroto No.46", lat: -7.5385, lng: 112.2321, jam: 12, bobot: 0.8 },
                { nama: "Dapur DK Jombang", alamat: "Jl. Dr. Sutomo No.33", lat: -7.5529, lng: 112.2368, jam: 17, bobot: 0.8 },
                { nama: "Warung Nasgor Pasar Legi", alamat: "Jl. KH. Mimbar", lat: -7.5432, lng: 112.2315, jam: 21, bobot: 0.9 },
                { nama: "Sarapan Alun-Alun Jombang", alamat: "Jl. Diponegoro", lat: -7.5462, lng: 112.2335, jam: 8, bobot: 0.9 },
                { nama: "Kuliner Kampus UNDAR", alamat: "Jl. Gus Dur, Candi Mulyo", lat: -7.5582, lng: 112.2325, jam: 12, bobot: 0.9 },
                { nama: "Kuliner Kampus UNIPDU", alamat: "Peterongan, Jombang", lat: -7.5435, lng: 112.2745, jam: 12, bobot: 1.0 },
                { nama: "Kuliner Tebuireng & Cukir", alamat: "Jl. Irian Jaya, Diwek", lat: -7.6035, lng: 112.2372, jam: 13, bobot: 0.9 },
                { nama: "Rawon Rosobo & Pusat Kuliner", alamat: "Jl. Raya Mojoagung", lat: -7.5732, lng: 112.3456, jam: 9, bobot: 1.0 }
            ];

            // 3. Render Pin Restoran (Menggunakan CircleMarker agar anti-error)
            function renderResto() {
                restoLayerGroup.clearLayers();
                daftarResto.forEach(function(resto) {
                    L.circleMarker([resto.lat, resto.lng], {
                        radius: 8,
                        fillColor: "#ee4d2d",
                        color: "#ffffff",
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.9
                    })
                    .bindPopup("<b>🍴 " + resto.nama + "</b><br><small>" + resto.alamat + "</small>")
                    .addTo(restoLayerGroup);
                });
            }

            // 4. Render Heatmap
            window.renderHeatmap = function() {
                if (heatLayer) map.removeLayer(heatLayer);
                const filter = document.getElementById('filter-waktu').value;
                
                const dataTersaring = daftarResto.filter(function(item) {
                    if (filter === 'semua') return true;
                    if (filter === 'pagi') return item.jam >= 6 && item.jam < 11;
                    if (filter === 'siang') return item.jam >= 11 && item.jam < 15;
                    if (filter === 'sore') return item.jam >= 15 && item.jam < 19;
                    if (filter === 'malam') return item.jam >= 19 || item.jam < 6;
                });

                const titikPanas = dataTersaring.map(function(item) {
                    return [item.lat, item.lng, item.bobot];
                });

                if (typeof L.heatLayer === 'function') {
                    heatLayer = L.heatLayer(titikPanas, {
                        radius: 40,
                        blur: 22,
                        maxZoom: 15,
                        gradient: {0.3: 'blue', 0.55: 'lime', 0.8: 'yellow', 1.0: 'red'}
                    }).addTo(map);
                }
            };

            window.toggleResto = function() {
                if (tampilkanResto) {
                    map.removeLayer(restoLayerGroup);
                    tampilkanResto = false;
                } else {
                    map.addLayer(restoLayerGroup);
                    tampilkanResto = true;
                }
            };

            window.cariLokasiSaya = function() {
                if ("geolocation" in navigator) {
                    navigator.geolocation.getCurrentPosition(function(pos) {
                        const lat = pos.coords.latitude;
                        const lng = pos.coords.longitude;
                        map.setView([lat, lng], 15);
                        if (markerSaya) map.removeLayer(markerSaya);
                        markerSaya = L.marker([lat, lng]).addTo(map)
                            .bindPopup("📍 Posisi Anda saat ini").openPopup();
                    }, function() {
                        alert("Pastikan GPS HP Anda aktif.");
                    });
                }
            };

            renderResto();
            renderHeatmap();
            statusEl.innerText = "Aktif (" + daftarResto.length + " Resto Jombang)";
            
            setTimeout(function() {
                map.invalidateSize();
            }, 300);
        };
    </script>
</body>
</html>
